<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Farrell Fyelo Hollans Tamaela</title>
    <style>
        /* CSS Dasar */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }

        /* Navigasi */
        nav {
            background-color: #2c3e50;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            color: #18bc9c;
        }

        /* Bagian Header (Hero Section) */
        header {
            background-color: #18bc9c;
            color: white;
            text-align: center;
            padding: 4rem 2rem;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        header p {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* Kontainer Utama */
        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        /* Bagian Umum */
        section {
            background: white;
            padding: 30px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        section h2 {
            border-bottom: 2px solid #18bc9c;
            padding-bottom: 10px;
            color: #2c3e50;
            margin-top: 0;
        }

        /* Daftar Keahlian */
        .skills-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .skills-list li {
            background: #2c3e50;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background: #2c3e50;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Navigasi -->
    <nav>
        <a href="#tentang">Tentang Saya</a>
        <a href="#keahlian">Keahlian</a>
        <a href="#proyek">Proyek</a>
        <a href="#kontak">Kontak</a>
    </nav>

    <!-- Header Profil -->
    <header>
        <h1>RubahAnomali</h1>
        <p>saya hidup</p>
    </header>

    <!-- Konten Utama -->
    <div class="container">
        
        <!-- Tentang Saya -->
        <section id="tentang">
            <h2>Tentang Saya</h2>
            <p>otw</p>
        </section>

        <!-- Keahlian -->
        <section id="keahlian">
            <h2>Keahlian</h2>
            <ul class="skills-list">
                <li>otw</li>
            </ul>
        </section>

        <!-- Proyek -->
        <section id="proyek">
            <h2>Proyek Terbaru</h2>
            <ul>
                <li>otw</li>

            </ul>
        </section>

        <!-- Kontak -->
        <section id="kontak">
            <h2>Kontak</h2>
            <p>ahihihihi</p>
            <ul>
                <li>otw</li>
            </ul>
        </section>

    </div>

    <!-- Footer -->
    <footer>
        <p>HUJAN API</p>
    </footer>

</body>
</html>
